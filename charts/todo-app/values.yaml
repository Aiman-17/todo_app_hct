# ─── Backend ────────────────────────────────────────────────
backend:
  image:
    repository: todo-backend
    tag: latest
    pullPolicy: IfNotPresent
  port: 8000
  replicas: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1.5Gi"
      cpu: "300m"
  healthProbe:
    path: /api/health
    initialDelay: 120
    period: 30
  env:
    CORS_ORIGINS: "http://localhost:3000"
    ENVIRONMENT: "development"

# ─── Frontend ───────────────────────────────────────────────
frontend:
  image:
    repository: todo-frontend
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "1Gi"
      cpu: "200m"
  healthProbe:
    path: /
    initialDelay: 120
    period: 30
  env:
    NEXT_PUBLIC_API_URL: "http://backend-service:8000"

# ─── Ingress ────────────────────────────────────────────────
ingress:
  enabled: true
  host: "localhost"
  tls:
    enabled: false
    secretName: ""

# ─── Secrets (no defaults — must be supplied at install time) ─
secrets:
  databaseUrl: ""
  betterAuthSecret: ""
  geminiApiKey: ""

# ─── Dapr ───────────────────────────────────────────────────
dapr:
  enabled: true
  appId:
    backend: "todo-backend"
    frontend: "todo-frontend"
  pubsub:
    name: "todo-pubsub"
    broker: "kafka.ai-taskmaster.svc.cluster.local:9092"
  statestore:
    name: "todo-statestore"
    redis: "redis.ai-taskmaster.svc.cluster.local:6379"

# ─── Kafka (Bitnami sub-chart — disabled; standalone deployed instead) ──
kafka:
  enabled: false

# ─── Redis (Bitnami sub-chart — disabled; standalone deployed instead) ──
redis:
  enabled: false

# ─── Standalone Kafka (apache/kafka) ───────────────────────
standaloneKafka:
  image: apache/kafka:3.8.1
  port: 9092
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"

# ─── Standalone Redis (official redis) ─────────────────────
standaloneRedis:
  image: redis:7.4
  port: 6379
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "150m"
      memory: "256Mi"

# ─── Kagent ─────────────────────────────────────────────────
kagent:
  enabled: true
  namespace: kagent
