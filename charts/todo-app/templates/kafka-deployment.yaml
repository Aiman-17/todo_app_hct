apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: ai-taskmaster
  labels:
    app: todo-app
    tier: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
      tier: kafka
  template:
    metadata:
      labels:
        app: todo-app
        tier: kafka
    spec:
      containers:
        - name: kafka
          image: {{ .Values.standaloneKafka.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.standaloneKafka.port }}
              name: client
            - containerPort: 9093
              name: internal
          env:
            - name: KAFKA_NODE_ID
              value: "0"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.ai-taskmaster.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@localhost:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kafka-logs"
          resources:
            requests:
              memory: {{ .Values.standaloneKafka.resources.requests.memory | quote }}
              cpu: {{ .Values.standaloneKafka.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.standaloneKafka.resources.limits.memory | quote }}
              cpu: {{ .Values.standaloneKafka.resources.limits.cpu | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ai-taskmaster
  labels:
    app: todo-app
    tier: kafka
spec:
  selector:
    app: todo-app
    tier: kafka
  ports:
    - name: client
      port: 9092
      targetPort: client
    - name: internal
      port: 9093
      targetPort: internal
