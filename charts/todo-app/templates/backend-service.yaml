apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ai-taskmaster
  labels:
    app: todo-app
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: todo-app
    tier: backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
      protocol: TCP
