apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ai-taskmaster
  labels:
    app: todo-app
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: todo-app
    tier: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      protocol: TCP
