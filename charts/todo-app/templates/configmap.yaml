apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
  namespace: ai-taskmaster
  labels:
    app: todo-app
data:
  CORS_ORIGINS: {{ .Values.backend.env.CORS_ORIGINS | quote }}
